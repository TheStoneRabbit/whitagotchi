name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build client
        run: cd client && go build ./...
      - name: build server
        run: cd server && go build ./...
      - name: vet
        run: cd client && go vet ./... && cd ../server && go vet ./...
